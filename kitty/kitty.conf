# kitty config, ported from alacritty/alacritty.toml
#
# Ported because Alacritty (and Ghostty) render between PTY read chunks, which
# leaves tmux's cursor visible at intermediate positions for a frame -- the
# single-cell flicker. kitty coalesces input first (input_delay, default 3ms)
# and is the only one of the three that is clean. Do NOT set input_delay to 0.

# --- shell ------------------------------------------------------------------
shell /bin/zsh --login

# --- font -------------------------------------------------------------------
font_family      family="ComicCode Nerd Font"
bold_font        family="ComicCode Nerd Font" style=Bold
italic_font      family="ComicCode Nerd Font" style=Italic
bold_italic_font family="ComicCode Nerd Font" style="Bold Italic"
font_size 14.25

# Alacritty had font.offset.y = -2 (tighter line spacing) and
# glyph_offset.y = -1 (glyph nudged down within the cell).
# kitty uses the same sign convention: positive = up.
modify_font cell_height -2px
modify_font baseline -1

# --- colors: Tokyo Night Storm ----------------------------------------------
background #24283b
foreground #a9b1d6

# normal
color0 #32344a
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #ad8ee6
color6 #449dab
color7 #9699a8

# bright
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0

# NOTE: Alacritty's draw_bold_text_with_bright_colors = true has no kitty
# equivalent -- kitty has no such option. Alacritty rendered bold text by
# swapping in the bright colour variant; kitty renders it with the bold font
# face at the normal colour. Since ComicCode ships a real Bold, you get actual
# bold weight instead of brightened colour. Bold text will look different --
# heavier, but not brighter. If you preferred the brighter look, the only way
# to approximate it is to set color0-7 closer to their bright counterparts,
# which is not recommended.

# Alacritty draws the cursor as reverse-video by default; `none` matches that
# rather than kitty's default solid grey.
cursor none

# --- window -----------------------------------------------------------------
background_opacity 1.0
window_padding_width 0
# Closest analogue to Alacritty's dynamic_padding: centre the grid so leftover
# pixels are split evenly instead of all landing on one edge.
placement_strategy center

# --- scrollback -------------------------------------------------------------
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# --- keybindings ------------------------------------------------------------
# Alacritty's Command/Option bindings were macOS-only. Command has no Linux
# equivalent, so SpawnNewInstance is remapped; Option becomes alt.

# was: Command+N -> SpawnNewInstance
map ctrl+shift+n new_os_window_with_cwd

# was: Control+Back ->   (Ctrl-W, delete previous word)
map ctrl+backspace send_text all \x17

# was: Control+Shift+F -> [D  (Left)
map ctrl+shift+f send_text all \x1b[D
# was: Control+G -> [A  (Up)
map ctrl+g send_text all \x1b[A
# was: Control+Shift+G -> [B  (Down)
map ctrl+shift+g send_text all \x1b[B

# was: Option+B / Option+F -> ESC-B / ESC-F  (word back / word forward)
map alt+b send_text all \x1bB
map alt+f send_text all \x1bF

# was: Option+J/K/H/L -> literal arrow glyphs
map alt+j send_text all ▼
map alt+k send_text all ▲
map alt+h send_text all ◀
map alt+l send_text all ▶

# --- dropped in the port ----------------------------------------------------
# window.decorations = "buttonless"   macOS-only; Hyprland owns decorations here.
# mouse middle-click PasteSelection   already kitty's default binding.
# selection.semantic_escape_chars     that value is Alacritty's own default;
#                                     kitty's select_by_word_characters default
#                                     is equivalent, so nothing to carry over.
