general {
    # inhibit_sleep = 3                           # hold the sleep inhibitor until the session is actually locked.
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = openrgb --config /home/neil/.config/OpenRGB --profile mem-sleep ; loginctl lock-session
    # NOTE: Hyprland >= 0.56 parses `hyprctl dispatch` args as Lua. The old
    # `hyprctl dispatch dpms on` form is a syntax error (exit 7), so this whole
    # line used to be a no-op -- and the `&&` meant rgb-resume.sh never ran either.
    # force_renderer_reload re-inits the outputs without ever DPMS-ing them off;
    # DPMS off on this DP link does not recover.
    after_sleep_cmd = hyprctl dispatch "hl.dsp.force_renderer_reload()" ; ddcutil --bus 4 setvcp 10 50 ; ~/.config/hypr/scripts/rgb-resume.sh &
}

listener {
    timeout = 900                                 # 15min.
    on-timeout = playerctl -p strawberry status 2>/dev/null | grep -q Playing || ddcutil --bus 4 setvcp 10 0
    on-resume = ddcutil --bus 4 setvcp 10 50
}

listener {
    timeout = 1500                                # 25min
    on-timeout = playerctl -p strawberry status 2>/dev/null | grep -q Playing || loginctl lock-session   # lock screen when timeout has passed (skipped while music plays)
}

listener {
    timeout = 1800                                # 30min
    on-timeout = playerctl -p strawberry status 2>/dev/null | grep -q Playing || systemctl suspend   # suspend pc (skipped while music plays)
}
