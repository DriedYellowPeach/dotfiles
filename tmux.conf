#!/usr/bin/env bash

# terminal setting
# set -g default-terminal 'xterm-256color'
# set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -g default-terminal "${TERM}"
set -as terminal-overrides ',alacritty*:Tc:sitm=\E[3m'

# Alacritty supports synchronized updates (DECSET 2026), but the `alacritty`
# terminfo entry shipped by ncurses has no `Sync` capability, so tmux never
# learns this and repaints panes unsynchronized. Alacritty then presents
# half-finished frames and single cells flicker with transient content during
# fast redraws (neo-tree/float toggles in nvim, typing in a TUI). kitty's
# terminfo does declare Sync, which is why kitty is unaffected.
set -as terminal-features ',alacritty*:sync'

# Same story for coloured underlines: the `alacritty` entry has Smulx but no
# Setulc, so undercurls render but always in the foreground colour. kitty and
# ghostty ship both caps, so scoping this to alacritty* keeps their own
# (correct) Setulc from being overwritten. Smulx needs no override anywhere.
set -as terminal-overrides ',alacritty*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# tmux implements sixel but not the kitty graphics protocol, so image escapes
# have to be tunnelled to kitty verbatim. snacks.image sets this per-pane on
# its own; setting it globally means panes created before nvim starts (and
# other passthrough users) work too.
set -g allow-passthrough on

# use mouse
set -g mouse on

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# copy and paste like vim
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# the esc from vim too slow
set -s escape-time 0

# TokyoNight colors for Tmux

set -g mode-style "fg=#82aaff,bg=#3b4261"

set -g message-style "fg=#82aaff,bg=#3b4261"
set -g message-command-style "fg=#82aaff,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#82aaff,bg=#1e2030"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1b1d2b,bg=#f6ae2d,bold] #S #[fg=#f6ae2d,bg=#1e2030,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#1e2030] #{prefix_highlight} #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#f6ae2d,bg=#3b4261] %I:%M %p #[fg=#f6ae2d,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#1b1d2b,bg=#f6ae2d,bold] #(whoami)@#(cat /etc/hostname) "

setw -g window-status-activity-style "underscore,fg=#828bb8,bg=#1e2030"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#828bb8,bg=#1e2030"
# setw -g window-status-format "#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]"
setw -g window-status-format '#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]#[default]#I:#(pwd="#{pane_current_path}"; echo ${pwd####*/}) #F#[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]'
# setw -g window-status-current-format "#[fg=#1e2030,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]"
# setw -g window-status-current-format "#[fg=#1e2030,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#f26419,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]"
setw -g window-status-current-format '#[fg=#1e2030,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#f26419,bg=#3b4261,bold] #I:#(pwd="#{pane_current_path}"; echo ${pwd####*/}) #F#[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]'

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#ffc777]#[bg=#1e2030]#[fg=#1e2030]#[bg=#ffc777]"
set -g @prefix_highlight_output_suffix ""
